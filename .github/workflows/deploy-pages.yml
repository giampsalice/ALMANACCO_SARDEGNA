name: Pubblica la galleria su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa il convertitore
        run: pip install -r requirements.txt

      - name: Aggiorna il catalogo dal foglio Excel
        run: python scripts/export_xlsx.py

      - name: Sincronizza il CSV pubblico di Google Drive
        run: |
          curl --fail --location --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVCyWIc4k5EzJWDY7qYKxP0xkYfrbbUVsg65Av05ZXnqFCbyNrSMEeIcTBpbkyDr1T2mJwgQQVukeF/pub?output=csv" \
            --output data/numeri.csv \
            || echo "Google Drive non raggiungibile: uso la copia locale"

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

    - name: Prepara i file da pubblicare
        run: |
          mkdir -p _site
          cp -R index.html assets data _site/
          touch _site/.nojekyll

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
