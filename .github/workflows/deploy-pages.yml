name: Pubblica la galleria su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sincronizza il CSV pubblico
        run: |
          curl --fail --location --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVCyWIc4k5EzJWDY7qYKxP0xkYfrbbUVsg65Av05ZXnqFCbyNrSMEeIcTBpbkyDr1T2mJwgQQVukeF/pub?output=csv" \
            --output data/numeri.csv \
            || echo "Uso la copia locale del CSV"

      - name: Prepara i file da pubblicare
        run: |
          mkdir -p _site
          cp -R index.html assets data _site/
          touch _site/.nojekyll

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
